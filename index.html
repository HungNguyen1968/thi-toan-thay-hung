/* ---------------- kho câu sai (giáo viên) ---------------- */
async function loadBank(){
  const prev = S.bank || {};
  S.bank = { st: prev.st || 'all', code: prev.code || 'all', title: prev.title || '', open: prev.open || '', close: prev.close || '', sel: prev.sel || new Set(), loaded: prev.loaded, items: prev.items, students: prev.students, psets: prev.psets, loading: true };
  if (!prev.loaded) paintBank();
  try {
    const [exams, subs, keys, prac, psets] = await Promise.all([S.be.list('exams'), S.be.list('subs'), S.be.list('keys'), S.be.list('practice'), S.be.list('psets')]);
    const stu = new Map();
    subs.filter(x => x.status === 'done').forEach(x => {
      const nk = x.nameKey || normName(x.name); if (!nk) return;
      const r = stu.get(nk) || { nk, name: x.name, latest: new Map() };
      const pv = r.latest.get(x.code); if (!pv || x.submittedAt > pv.submittedAt){ r.latest.set(x.code, x); r.name = x.name; }
      stu.set(nk, r);
    });
    const mastered = {}; prac.forEach(x => { mastered[x.nameKey || x.id] = x.mastered || {}; });
    const keyBy = new Map(keys.map(k => [k.code || k.id, k]));
    const items = [];
    exams.sort((a, b) => a.createdAt - b.createdAt).forEach(E => {
      const key = keyBy.get(E.code);
      E.questions.forEach((q, i) => {
        const id = E.code + '_' + q.n, wrong = [];
        stu.forEach(r => {
          const sub = r.latest.get(E.code);
          if (!sub || (sub.perQ && sub.perQ[i])) return;
          const m = mastered[r.nk] && mastered[r.nk][id];
          wrong.push({ nk: r.nk, name: r.name, ans: sub.answers ? sub.answers[q.n] : undefined, fixed: !!(m && m > sub.submittedAt) });
        });
        if (wrong.length) items.push({ id, E, q, k: key && key.answers ? key.answers[q.n] : undefined, sol: (key && key.sol && key.sol[q.n]) || [], wrong });
      });
    });
    const B = S.bank;
    B.items = items; B.psets = psets;
    B.students = [...stu.values()].map(r => ({ nk: r.nk, name: r.name })).sort((a, b) => a.name.localeCompare(b.name, 'vi'));
    if (B.st !== 'all' && !B.students.some(x => x.nk === B.st)) B.st = 'all';
    if (B.code !== 'all' && !exams.some(e => e.code === B.code)) B.code = 'all';
    const live = new Set(bankVisible().map(it => it.id));
    B.sel = new Set([...B.sel].filter(id => live.has(id)));
    B.loaded = true; B.loading = false; B.error = '';
  } catch(e){ S.bank.loading = false; S.bank.error = 'Không tải được kho câu sai: ' + (e.message || e); }
  paintBank();
}

async function bankAssign(){
  const B = S.bank;
  const chosen = (B.items || []).filter(it => B.sel.has(it.id));
  if (!chosen.length) return;
  const openV = ($('#bk-open') || {}).value || '', closeV = ($('#bk-close') || {}).value || '';
  const openAt = openV ? new Date(openV).getTime() : null, closeAt = closeV ? new Date(closeV).getTime() : null;
  if (closeAt && closeAt <= (openAt || Date.now())){ toast('Giờ đóng phải sau giờ mở và sau thời điểm hiện tại.', 'err'); return; }
  const students = B.st === 'all' ? null : [B.st];
  const targets = students ? B.students.filter(x => x.nk === B.st) : B.students;
  const per = targets.map(x => ({ name: x.name, n: chosen.filter(it => it.wrong.some(w => w.nk === x.nk && !w.fixed)).length })).filter(x => x.n);
  if (!per.length){ toast('Các câu đã chọn không còn em nào cần làm lại.', 'err'); return; }
  const durV = ($('#bk-dur') || {}).value;
  if (durV === '' || isNaN(+durV) || +durV < 0 || +durV > 600){ toast('Thời gian làm bài từ 0 đến 600 phút.', 'err'); return; }
  const title = (($('#bk-title') || {}).value || '').trim() || `Làm lại câu sai ${fmtDate(Date.now())}`;
  const body = `Giao “${title}” gồm ${chosen.length} câu. ${per.map(x => `${x.name}: ${x.n} câu`).join(', ')}.${openAt ? ` Mở lúc ${fmtDate(openAt)}.` : ' Mở ngay.'}${closeAt ? ` Đóng lúc ${fmtDate(closeAt)}.` : ''}${+durV ? ` Thời gian làm bài ${Math.round(+durV)} phút.` : ''}`;
  if (!await modal({ title: 'Giao làm lại các câu đã chọn?', body, ok: 'Giao làm lại' })) return;
  const ids = chosen.map(it => it.id);
  try {
    const id = await freeCode();
    const doc = { id, code: id, title, mode: 'pick', items: ids, codes: [...new Set(ids.map(x => x.split('_')[0]))], counts: {}, students, studentNames: students ? targets.map(x => x.name) : null, openAt, closeAt, duration: Math.round(+durV), createdAt: Date.now(), teacher: LS.get('tt_teacher') || '' };
    await S.be.set('psets', id, doc);
    B.sel = new Set(); B.title = ''; B.open = ''; B.close = ''; B.dur = 0;
    S.psets = undefined;
    loadBank();
    await setCodeModal(doc);
  } catch(e){ toast('Không giao được: ' + (e.message || e), 'err'); }
}

async function replaceQuestion(id){
  const it = (S.bank.items || []).find(x => x.id === id); if (!it) return;
  const E0 = it.E, q0 = it.q, n = q0.n;
  const html = `<p class="hint">Thay nội dung câu này trong đề gốc “${esc(E0.title)}”. Ảnh và đáp án mới áp dụng cho cả đề thi lẫn kho câu sai.</p>
    <div class="rq-old">${q0.q.map(r => `<img data-ref="${esc(r)}" alt="Câu ${n} hiện tại">`).join('') || '<span class="hint">Câu hiện tại không có ảnh.</span>'}</div>
    <div class="es-grid">
      <label class="field full">Ảnh câu hỏi mới (để trống nếu giữ ảnh cũ)<input class="input" type="file" id="rq-img" accept="image/*" multiple></label>
      <label class="field full">Ảnh lời giải mới (để trống nếu giữ lời giải cũ)<input class="input" type="file" id="rq-sol" accept="image/*" multiple></label>
      <label class="field">Loại câu<select class="input" id="rq-type">${Object.entries(TYPE_LABEL).map(([k, l]) => `<option value="${k}" ${q0.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="field">Đáp án<input class="input" id="rq-ans" value="${esc(it.k != null ? it.k : '')}" autocomplete="off"></label>
    </div>
    <div class="checks" style="margin:12px 0 4px">
      <label class="check"><input type="checkbox" id="rq-regrade" checked><span>Chấm lại các bài đã nộp của đề này theo đáp án mới</span></label>
      <label class="check"><input type="checkbox" id="rq-reset" checked><span>Bắt học sinh luyện lại câu này từ đầu (xoá dấu “đã làm lại đúng” của câu)</span></label>
    </div>
    <div id="rq-msg" class="hint" role="status"></div>`;
  const pr = modal({ title: `Thay câu ${n} của đề ${E0.code}`, html, wide: true, ok: 'Lưu câu mới',
    validate: async () => {
      const type = $('#rq-type').value, raw = $('#rq-ans').value.trim();
      const err = answerError({ type, answer: raw }, true); if (err) return err;
      const qFiles = [...$('#rq-img').files], sFiles = [...$('#rq-sol').files];
      const msg = $('#rq-msg');
      if ((qFiles.length || sFiles.length) && !S.be.canUpload) return 'Tài khoản đang mở trang không có quyền tải ảnh lên.';
      try {
        const E = await S.be.get('exams', E0.code); if (!E) return 'Không tìm thấy đề, có thể đã bị xoá.';
        const key = (await S.be.get('keys', E0.code)) || { code: E0.code, answers: {}, sol: {} };
        const qi = E.questions.findIndex(x => x.n === n); if (qi < 0) return 'Không tìm thấy câu này trong đề.';
        const sortF = arr => arr.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        const up = async (files, what) => { const refs = []; let i = 0; for (const f of sortF(files)){ i++; msg.textContent = `Đang tải ${what} ${i}/${files.length}…`; refs.push(await S.be.putImage(await fitImage(f, S.be.imgLimit))); } return refs; };
        const newQ = qFiles.length ? await up(qFiles, 'ảnh câu hỏi') : null;
        const newS = sFiles.length ? await up(sFiles, 'ảnh lời giải') : null;
        const oldQ = E.questions[qi].q || [], oldS = (key.sol && key.sol[n]) || [];
        msg.textContent = 'Đang lưu đề…';
        E.questions[qi] = { n, type, q: newQ || oldQ };
        key.answers = { ...key.answers, [n]: canon({ type, answer: raw }) };
        key.sol = { ...(key.sol || {}) }; if (newS) key.sol[n] = newS;
        await S.be.set('keys', E0.code, key);
        await S.be.set('exams', E0.code, E);
        replaceExam(E);
        await safeDelImages([...(newQ ? oldQ : []), ...(newS ? oldS : [])], E0.code);
        if ($('#rq-regrade').checked){
          msg.textContent = 'Đang chấm lại các bài đã nộp…';
          const subs = (await S.be.list('subs', 'code', E0.code)).filter(x => x.status === 'done');
          for (const sub of subs){
            const g = grade(E, key, sub.answers || {});
            const body = { ...sub }; delete body.id;
            await S.be.set('subs', sub.id, { ...body, score: g.score, max: g.max, correct: g.correct, perQ: g.perQ });
          }
        }
        if ($('#rq-reset').checked){
          msg.textContent = 'Đang xoá tiến độ luyện tập của câu này…';
          for (const doc of await S.be.list('practice')){
            if (doc.mastered && doc.mastered[id] != null){ const m = { ...doc.mastered }; delete m[id]; const body = { ...doc }; delete body.id; await S.be.set('practice', doc.id, { ...body, mastered: m }); }
          }
          for (const doc of await S.be.list('presults')){
            if (doc.items && doc.items[id] != null){ const its = { ...doc.items }; delete its[id]; const body = { ...doc }; delete body.id; await S.be.set('presults', doc.id, { ...body, items: its }); }
          }
        }
      } catch(e){ return 'Không lưu được: ' + (e.message || e); }
      return '';
    } });
  hydrate($('#modal-root'));
  const ok = await pr;
  if (!ok) return;
  IMG_CACHE.clear();
  toast(`Đã thay câu ${n} của đề ${E0.code}.`);
  loadBank();
  if (S.res && S.res.code === E0.code) loadResults(E0.code);
}

async function exportKey(code){
  if (!window.XLSX){ toast('Không tải được thư viện Excel. Kiểm tra mạng rồi tải lại trang.', 'err'); return; }
  let E, key;
  try { [E, key] = await Promise.all([S.be.get('exams', code), S.be.get('keys', code)]); } catch(e){ toast('Không tải được đề: ' + (e.message || e), 'err'); return; }
  if (!E || !key){ toast('Không tìm thấy đề này.', 'err'); return; }
  const rows = [['STT', 'Đáp án', 'Loại câu', 'Có ảnh đề', 'Có lời giải'],
    ...E.questions.map(q => [q.n, key.answers ? key.answers[q.n] : '', TYPE_LABEL[q.type], (q.q || []).length ? 'Có' : '', ((key.sol || {})[q.n] || []).length ? 'Có' : ''])];
  const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = [{ wch: 6 }, { wch: 12 }, { wch: 16 }, { wch: 10 }, { wch: 12 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Đáp án');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  try { await S.be.save(`Dap_an_${code}.xlsx`, new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); }
  catch(e){ if (!(e && e.code === 'declined')) toast('Không tải được file: ' + ((e && (e.message || e.code)) || e), 'err'); }
}
async function syncExamFiles(code){
  const E0 = S.exams.find(x => x.code === code); if (!E0) return;
  const html = `<p class="hint">Chọn file Excel đáp án và ảnh mới (đặt tên như lúc tạo đề: Cau_01.png, Da_01.png, hoặc một file .zip). Trang sẽ so sánh với đề đang chạy và cho thầy cô duyệt trước khi áp dụng. Phần nào không chọn file thì giữ nguyên.</p>
    <div class="es-grid">
      <label class="field full">File đáp án (Excel)<input class="input" type="file" id="sy-x" accept=".xlsx,.xls,.csv"></label>

    </div>
    <div class="checks" style="margin:12px 0 4px">

      <label class="check"><input type="checkbox" id="sy-regrade" checked><span>Chấm lại các bài đã nộp theo đáp án mới</span></label>
      <label class="check"><input type="checkbox" id="sy-reset" checked><span>Bắt học sinh luyện lại những câu có thay đổi</span></label>
    </div>
    <div id="sy-msg" class="hint" role="status"></div>`;
  let plan = null;
  const ok1 = await modal({ title: `Cập nhật đề ${code} từ file`, html, wide: true, ok: 'Xem thay đổi',
    validate: async () => {

      const xf = $('#sy-x').files[0], imgFiles = [...$('#sy-img').files];
      if (!xf && !imgFiles.length) return 'Chọn file Excel hoặc ảnh trước.';
      msg.textContent = 'Đang đọc file…';
      try {
        const key = {}, imgs = { q: {}, s: {} }, skipped = [];
        const addImg = (name, blob) => { const c = classify(name); if (!c){ skipped.push(name); return; } (imgs[c.kind][c.n] = imgs[c.kind][c.n] || []).push({ name, blob }); };
        const readZip = async f => {
          if (!window.JSZip) throw new Error('Không tải được thư viện đọc file zip.');
          const zip = await JSZip.loadAsync(f);
          for (const e of Object.values(zip.files)){
            if (e.dir || e.name.includes('__MACOSX')) continue;
            const base = e.name.split('/').pop(); if (!base || base.startsWith('.')) continue;
            if (IMG_RE.test(base)){ const bl = await e.async('blob'); addImg(base, new Blob([bl], { type: mimeOf(base) })); }
            else if (SHEET_RE.test(base)) Object.assign(key, parseSheet(await e.async('arraybuffer')));
          }
        };
        if (xf) Object.assign(key, parseSheet(await xf.arrayBuffer()));
        for (const f of imgFiles){
          if (/\.zip$/i.test(f.name)) await readZip(f);
          else if (IMG_RE.test(f.name)) addImg(f.name, f);
          else if (SHEET_RE.test(f.name)) Object.assign(key, parseSheet(await f.arrayBuffer()));
          else skipped.push(f.name);
        }
        const E = await S.be.get('exams', code); if (!E) return 'Không tìm thấy đề, có thể đã bị xoá.';
        const K = (await S.be.get('keys', code)) || { code, answers: {}, sol: {} };
        const sortI = a => (a || []).sort((x, y) => x.name.localeCompare(y.name, undefined, { numeric: true }));
        const changes = [];
        E.questions.forEach(q => {
          const raw = key[q.n] !== undefined ? String(key[q.n]).trim() : '';

          if (imgs.s[q.n]) parts.push(`${imgs.s[q.n].length} ảnh lời giải mới`);

        });

            const raw = key[n] !== undefined ? String(key[n]).trim() : '';
            if (!raw) return;
            const type = detectType(raw) || 'mc';
            changes.push({ n, kind: 'add', type, ans: canon({ type, answer: raw }), qImgs: imgs.q[n] ? sortI(imgs.q[n]) : null, sImgs: imgs.s[n] ? sortI(imgs.s[n]) : null, text: `câu mới, đáp án ${esc(canon({ type, answer: raw }))}${imgs.q[n] ? `, ${imgs.q[n].length} ảnh đề` : ', chưa có ảnh đề'}` });

    html: `<p>${plan.changes.length} câu sẽ thay đổi trong đề “${esc(plan.E.title)}”.${plan.skipped.length ? ` Bỏ qua ${plan.skipped.length} file không đúng tên.` : ''}</p>
      <div class="table-wrap"><table><thead><tr><th>Câu</th><th>Việc</th><th>Thay đổi</th></tr></thead><tbody>${list}</tbody></table></div>
      <p class="hint" style="margin-top:10px">${plan.regrade ? 'Các bài đã nộp sẽ được chấm lại theo đáp án mới. ' : 'Không chấm lại bài đã nộp. '}${plan.reset ? 'Học sinh phải luyện lại các câu này.' : ''}</p>` });
  if (!ok2) return;
  toast('Đang cập nhật đề…');
  try {

    K.answers = { ...(K.answers || {}) }; K.sol = { ...(K.sol || {}) };
    const trash = [];
    for (const c of changes){
      const up = async files => { const refs = []; for (const f of files) refs.push(await S.be.putImage(await fitImage(f.blob, S.be.imgLimit))); return refs; };
      const newQ = c.qImgs ? await up(c.qImgs) : null, newS = c.sImgs ? await up(c.sImgs) : null;
      if (c.kind === 'add'){
        E.questions.push({ n: c.n, type: c.type, q: newQ || [] });
        E.questions.sort((a, b) => a.n - b.n);
      } else {
        const qi = E.questions.findIndex(q => q.n === c.n);
        if (newQ) trash.push(...(E.questions[qi].q || []));
        E.questions[qi] = { n: c.n, type: c.type, q: newQ || E.questions[qi].q };
      }
      if (c.ans != null) K.answers[c.n] = c.ans;
      if (newS){ trash.push(...((K.sol[c.n]) || [])); K.sol[c.n] = newS; }
    }
    await S.be.set('keys', code, K);
    await S.be.set('exams', code, E);
    replaceExam(E);
    await safeDelImages(trash, code);
    if (plan.regrade){
      const subs = (await S.be.list('subs', 'code', code)).filter(x => x.status === 'done');
      for (const sub of subs){
        const g = grade(E, K, sub.answers || {});
        const body = { ...sub }; delete body.id;
        await S.be.set('subs', sub.id, { ...body, score: g.score, max: g.max, correct: g.correct, perQ: g.perQ });
      }
    }
    if (plan.reset){
      const ids = new Set(changes.map(c => code + '_' + c.n));
      for (const doc of await S.be.list('practice')){
        const m = { ...(doc.mastered || {}) }; let hit = false;
        ids.forEach(id => { if (m[id] != null){ delete m[id]; hit = true; } });
        if (hit){ const body = { ...doc }; delete body.id; await S.be.set('practice', doc.id, { ...body, mastered: m }); }
      }
      for (const doc of await S.be.list('presults')){
        const its = { ...(doc.items || {}) }; let hit = false;
        ids.forEach(id => { if (its[id] != null){ delete its[id]; hit = true; } });
        if (hit){ const body = { ...doc }; delete body.id; await S.be.set('presults', doc.id, { ...body, items: its }); }
      }
    }
    IMG_CACHE.clear();
    toast(`Đã cập nhật ${changes.length} câu của đề ${code}.`);
    await loadExams();
    if (S.res && S.res.code === code) loadResults(code);
  } catch(e){ toast('Cập nhật chưa xong: ' + (e.message || e), 'err'); }
}

/* ---------------- kho câu hỏi cũ (ghép đề mới) ---------------- */
const QB_TARGET = { mc: 12, tf: 4, sa: 6 };
async function toggleQBank(){
  S.qb = S.qb || { open: false, targets: { ...QB_TARGET }, sel: new Set(), code: 'all', renumber: true };
  S.qb.open = !S.qb.open;
  paintQB();
  if (S.qb.open && !S.qb.loaded) await loadQBank();
}
async function loadQBank(){
  const Q = S.qb; Q.loading = true; paintQB();
  try {
    const [exams, keys] = await Promise.all([S.be.list('exams'), S.be.list('keys')]);
    const keyBy = new Map(keys.map(k => [k.code || k.id, k]));
    const items = [];
    exams.sort((a, b) => b.createdAt - a.createdAt).forEach(E => {
      const K = keyBy.get(E.code);
      E.questions.forEach(q => {
        const ans = K && K.answers ? K.answers[q.n] : undefined;
        if (ans == null || ans === '') return;
        items.push({ id: E.code + '_' + q.n, code: E.code, title: E.title, n: q.n, type: q.type, ans, qRefs: q.q || [], sRefs: (K.sol && K.sol[q.n]) || [] });
      });
    });
    Q.items = items; Q.exams = exams.filter(E => items.some(i => i.code === E.code)); Q.loaded = true; Q.error = '';
  } catch(e){ Q.error = 'Không tải được kho câu hỏi: ' + (e.message || e); }
  S.qb.loading = false; paintQB();
}
function paintQB(){ const el = $('#qbank'); if (el){ el.innerHTML = qbHTML(); hydrate(el); } }
const qbUsed = it => S.draft.questions.some(q => q.src && q.src.code === it.code && q.src.n === it.n);
function qbVisible(){ const Q = S.qb; return (Q.items || []).filter(it => Q.code === 'all' || it.code === Q.code); }
function qbHTML(){
  const Q = S.qb;
  if (!Q || !Q.open) return '';
  if (Q.loading || (!Q.loaded && !Q.error)) return '<p class="hint" role="status" style="margin-top:12px">Đang mở kho câu hỏi…</p>';
  if (Q.error) return `<p style="margin-top:12px">${errSpan(Q.error)}</p><button class="btn" data-act="qb-reload">Thử lại</button>`;
  if (!(Q.items || []).length) return '<div class="empty" style="margin-top:12px">Chưa có đề cũ nào có đáp án để lấy câu.</div>';
  const vis = qbVisible();
  const byType = { mc: [], tf: [], sa: [] }; vis.forEach(it => byType[it.type] && byType[it.type].push(it));
  const sec = t => `<h4>${TYPE_LABEL[t]} <span class="count-badge">${byType[t].length}</span><span id="qb-chip-${t}">${qbChip(t)}</span></h4>${byType[t].length ? byType[t].map(qbRow).join('') : '<p class="hint" style="padding:8px 2px">Không có câu nào.</p>'}`;
  return `<div class="qb-head">
      <label class="field" style="min-width:220px">Lấy từ đề<select class="input" id="qb-code"><option value="all">Tất cả các đề (${(Q.items || []).length} câu)</option>${Q.exams.map(E => `<option value="${esc(E.code)}" ${Q.code === E.code ? 'selected' : ''}>${esc(E.title)} (${(Q.items || []).filter(i => i.code === E.code).length} câu)</option>`).join('')}</select></label>
      <div class="qb-targets">${['mc', 'tf', 'sa'].map(t => `<label class="field">${TYPE_LABEL[t]}<input class="input" type="number" min="0" max="50" data-qb-target="${t}" value="${esc(Q.targets[t])}"></label>`).join('')}</div>
      <div class="row"><button class="btn primary" data-act="qb-auto">Ghép ngẫu nhiên vào danh sách</button><button class="btn" data-act="qb-random">Chỉ chọn ngẫu nhiên</button><button class="btn ghost" data-act="qb-clear" ${Q.sel.size ? '' : 'disabled'}>Bỏ chọn</button></div>
    </div>
    <div class="qb-count" id="qb-sum">${qbSum()}</div>
    <div class="qb-list">${['mc', 'tf', 'sa'].map(sec).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" data-act="qb-add" ${Q.sel.size ? '' : 'disabled'}>Thêm ${Q.sel.size} câu vào danh sách</button>
      <label class="check" style="margin-left:6px"><input type="checkbox" id="qb-renum" ${Q.renumber ? 'checked' : ''}><span>Đánh số lại 1, 2, 3… theo thứ tự trắc nghiệm, đúng/sai, trả lời ngắn</span></label></div>`;
}
function qbSelN(t){ const Q = S.qb; return (Q.items || []).filter(it => Q.sel.has(it.id) && it.type === t).length; }
function qbChip(t){ const Q = S.qb, n = qbSelN(t), g = +Q.targets[t] || 0; return `<span class="chip ${g && n === g ? 'ok' : g && n > g ? 'bad' : ''}">${TYPE_LABEL[t]}: ${n}${g ? '/' + g : ''}</span>`; }
const qbSum = () => ['mc', 'tf', 'sa'].map(qbChip).join('') + `<span class="chip info">Tổng: ${S.qb.sel.size} câu</span>`;
function qbSync(){
  const Q = S.qb;
  $$('[data-qb]').forEach(b => { const on = Q.sel.has(b.dataset.qb); b.checked = on; b.closest('.bank-row').classList.toggle('sel', on); });
  const sum = $('#qb-sum'); if (sum) sum.innerHTML = qbSum();
  ['mc', 'tf', 'sa'].forEach(t => { const el = $('#qb-chip-' + t); if (el) el.innerHTML = qbChip(t); });
  const add = $('[data-act="qb-add"]'); if (add){ add.disabled = !Q.sel.size; add.textContent = `Thêm ${Q.sel.size} câu vào danh sách`; }
  const clr = $('[data-act="qb-clear"]'); if (clr) clr.disabled = !Q.sel.size;
}
function qbRow(it){
  const on = S.qb.sel.has(it.id), used = qbUsed(it);
  return `<div class="bank-row ${on ? 'sel' : ''} ${used ? 'used' : ''}">
    <input type="checkbox" data-qb="${esc(it.id)}" ${on ? 'checked' : ''} ${used ? 'disabled' : ''} aria-label="Chọn câu ${it.n} đề ${esc(it.title)}">
    ${it.qRefs.length ? `<img class="bank-thumb" data-ref="${esc(it.qRefs[0])}" alt="">` : '<span class="hint">Không có ảnh</span>'}
    <div><div><strong>Câu ${it.n}</strong> <span class="hint" style="display:inline">Đáp án: ${esc(it.ans)}${it.sRefs.length ? ', có lời giải' : ''}</span></div><div class="src-tag">${esc(it.title)} (${esc(it.code)})${used ? ' – đã có trong danh sách' : ''}</div></div>
    <button class="btn small" data-act="qb-view" data-id="${esc(it.id)}">Xem câu</button>
  </div>`;
}
async function qbView(id){
  const it = (S.qb.items || []).find(x => x.id === id); if (!it) return;
  const pr = modal({ title: `${it.title}, câu ${it.n}`, wide: true, ok: 'Đóng', cancel: '',
    html: `<p class="hint">${TYPE_LABEL[it.type]}. Đáp án: <strong>${esc(it.ans)}</strong></p>${it.qRefs.map(r => `<img class="qimg" data-ref="${esc(r)}" alt="Câu ${it.n}">`).join('') || '<p class="hint">Không có ảnh đề.</p>'}${it.sRefs.length ? `<details><summary>Xem lời giải</summary>${it.sRefs.map(r => `<img class="qimg" data-ref="${esc(r)}" alt="Lời giải">`).join('')}</details>` : ''}` });
  hydrate($('#modal-root'));
  await pr;
}
function qbRandom(){
  const Q = S.qb, vis = qbVisible();
  ['mc', 'tf', 'sa'].forEach(t => {
    const target = +Q.targets[t] || 0;
    [...Q.sel].forEach(id => { const it = Q.items.find(x => x.id === id); if (it && it.type === t) Q.sel.delete(id); });
    const pool = vis.filter(it => it.type === t && !qbUsed(it));
    for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    pool.slice(0, target).forEach(it => Q.sel.add(it.id));
  });
  qbSync();
  const short = ['mc', 'tf', 'sa'].filter(t => (+Q.targets[t] || 0) > vis.filter(it => it.type === t && !qbUsed(it)).length);
  if (short.length) toast(`Kho chưa đủ câu ${short.map(t => TYPE_LABEL[t].toLowerCase()).join(', ')}, đã lấy hết số có.`);
}
async function qbAdd(){
  const Q = S.qb, d = S.draft;
  const picked = (Q.items || []).filter(it => Q.sel.has(it.id) && !qbUsed(it));
  if (!picked.length) return;
  const order = { mc: 0, tf: 1, sa: 2 };
  picked.sort((a, b) => order[a.type] - order[b.type] || a.code.localeCompare(b.code) || a.n - b.n);
  const btn = $('[data-act="qb-add"]'); if (btn){ btn.disabled = true; btn.textContent = 'Đang thêm…'; }
  try {
    for (const it of picked){
      const toImg = async refs => { const out = []; for (const r of refs) out.push({ ref: r, url: await imgUrl(r) }); return out; };
      d.questions.push({ n: 0, type: it.type, answer: it.ans, manual: true, qImgs: await toImg(it.qRefs), sImgs: await toImg(it.sRefs), src: { code: it.code, n: it.n } });
    }
    if (Q.renumber) d.questions.sort((a, b) => order[a.type] - order[b.type]);
    let k = Math.max(0, ...d.questions.map(q => q.n).filter(n => n > 0));
    if (Q.renumber) d.questions.forEach((q, i) => { q.n = i + 1; });
    else d.questions.forEach(q => { if (!q.n) q.n = ++k; });
    Q.sel = new Set();
    d.showErrors = false;
    refreshQList(); paintQB();
    toast(`Đã thêm ${picked.length} câu vào danh sách.`);
  } catch(e){ toast('Không thêm được: ' + (e.message || e), 'err'); }
  if (btn && btn.isConnected){ btn.disabled = false; btn.textContent = `Thêm ${Q.sel.size} câu vào danh sách`; }
}

async function qbAuto(){
  S.qb = S.qb || { open: false, targets: { ...QB_TARGET }, sel: new Set(), code: 'all', renumber: true };
  if (!S.qb.open){ S.qb.open = true; paintQB(); }
  if (!S.qb.loaded) await loadQBank();
  if (!S.qb.loaded || !(S.qb.items || []).length){ toast('Kho chưa có câu nào để ghép. Cần ít nhất một đề cũ đã có đáp án.', 'err'); return; }
  qbRandom();
  if (!S.qb.sel.size){ toast('Không chọn được câu nào. Kiểm tra lại số câu mỗi phần.', 'err'); return; }
  await qbAdd();
  const el = $('#qlist'); if (el) el.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
async function shuffleExams(){
  S.qb = S.qb || { open: false, targets: { ...QB_TARGET }, sel: new Set(), code: 'all', renumber: true };
  if (!S.qb.loaded){ toast('Đang mở kho câu hỏi…'); await loadQBank(); }
  const items = S.qb.items || [];
  if (!items.length){ toast('Kho chưa có câu nào. Cần các đề cũ đã có đáp án.', 'err'); return; }
  const byExam = new Map();
  items.forEach(it => { const r = byExam.get(it.code) || { code: it.code, title: it.title, mc: 0, tf: 0, sa: 0, n: 0 }; r[it.type]++; r.n++; byExam.set(it.code, r); });
  const exams = [...byExam.values()];
  const d = S.draft;
  const html = `<p class="hint">Chia toàn bộ câu của các đề đã chọn vào một loạt đề mới, mỗi câu chỉ dùng một lần. Đề mới dùng chung ảnh với đề cũ nên gần như không tốn thêm dung lượng.</p>
    <fieldset class="pick"><legend>Đề nguồn</legend><div class="pick-grid">${exams.map(e => `<label class="check"><input type="checkbox" name="sh-src" value="${esc(e.code)}" checked><span>${esc(e.title)} <span class="hint" style="display:inline">(${e.mc} TN, ${e.tf} Đ/S, ${e.sa} TLN)</span></span></label>`).join('')}</div></fieldset>
    <div class="es-grid" style="margin-top:14px">
      <label class="field full">Tên đề mới (trang tự thêm số 1, 2, 3…)<input class="input" id="sh-title" value="Đề ôn tập"></label>
      <label class="field">Số đề tạo<input class="input" type="number" min="1" max="50" id="sh-n" value="10"></label>
      <label class="field">Trắc nghiệm mỗi đề<input class="input" type="number" min="0" max="50" id="sh-mc" value="${+S.qb.targets.mc || 12}"></label>
      <label class="field">Đúng/Sai mỗi đề<input class="input" type="number" min="0" max="50" id="sh-tf" value="${+S.qb.targets.tf || 4}"></label>
      <label class="field">Trả lời ngắn mỗi đề<input class="input" type="number" min="0" max="50" id="sh-sa" value="${+S.qb.targets.sa || 6}"></label>
    </div>
    <label class="check" style="margin-top:12px"><input type="checkbox" id="sh-del"><span><strong>Xoá các đề nguồn sau khi tạo xong</strong>, cùng toàn bộ bài nộp của chúng. Nên bấm “Sao lưu tất cả kết quả” ở mục Kết quả trước.</span></label>
    <p class="hint" style="margin-top:12px">Đề mới dùng cài đặt đang đặt ở khung Tạo đề: ${esc(d.teacher || LS.get('tt_teacher') || '(chưa nhập tên giáo viên)')}, ${Math.round(+d.duration) || 90} phút, ${+d.maxLogins ? d.maxLogins + ' lượt mỗi thiết bị' : 'không giới hạn lượt'}. Sửa ở trên rồi mở lại nếu cần.</p>
    <div id="sh-msg" class="hint" role="status"></div>`;
  let plan = null;
  const ok = await modal({ title: 'Trộn lại nhiều đề', html, wide: true, ok: 'Xem trước',
    validate: async () => {
      const codes = $$('input[name="sh-src"]:checked').map(x => x.value);
      if (!codes.length) return 'Chọn ít nhất một đề nguồn.';
      const t = { mc: +$('#sh-mc').value, tf: +$('#sh-tf').value, sa: +$('#sh-sa').value };
      if (['mc', 'tf', 'sa'].some(k => isNaN(t[k]) || t[k] < 0 || t[k] > 50)) return 'Số câu mỗi phần từ 0 đến 50.';
      const per = t.mc + t.tf + t.sa; if (!per) return 'Mỗi đề phải có ít nhất một câu.';
      const n = Math.round(+$('#sh-n').value);
      if (!(n >= 1 && n <= 50)) return 'Số đề tạo từ 1 đến 50.';
      const title = $('#sh-title').value.trim(); if (!title) return 'Nhập tên đề mới.';
      const teacher = (S.draft.teacher || LS.get('tt_teacher') || '').trim(); if (!teacher) return 'Nhập họ tên giáo viên ở khung Tạo đề phía trên trước.';
      const pool = { mc: [], tf: [], sa: [] };
      items.forEach(it => { if (codes.includes(it.code)) pool[it.type].push(it); });
      const maxN = Math.min(...['mc', 'tf', 'sa'].map(k => t[k] ? Math.floor(pool[k].length / t[k]) : Infinity));
      if (!isFinite(maxN)) return 'Cấu trúc đề không hợp lệ.';
      if (n > maxN) return `Kho chỉ đủ tạo ${maxN} đề (có ${pool.mc.length} trắc nghiệm, ${pool.tf.length} đúng/sai, ${pool.sa.length} trả lời ngắn). Giảm số đề hoặc bớt số câu mỗi phần.`;
      ['mc', 'tf', 'sa'].forEach(k => { for (let i = pool[k].length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[k][i], pool[k][j]] = [pool[k][j], pool[k][i]]; } });
      plan = { codes, t, n, title, teacher, pool, used: n * per, total: pool.mc.length + pool.tf.length + pool.sa.length, del: $('#sh-del').checked };
      return '';
    } });
  if (!ok || !plan) return;
  const ok2 = await modal({ title: 'Tạo đề mới?', kind: 'danger', ok: 'Tạo đề',
    body: `Sẽ tạo ${plan.n} đề: “${plan.title} 1” đến “${plan.title} ${plan.n}”, mỗi đề ${plan.t.mc} trắc nghiệm, ${plan.t.tf} đúng/sai, ${plan.t.sa} trả lời ngắn. Dùng ${plan.used}/${plan.total} câu trong kho, không câu nào lặp lại giữa các đề.${plan.del ? ` Sau đó xoá ${plan.codes.length} đề nguồn cùng toàn bộ bài nộp của chúng.` : ''}` });
  if (!ok2) return;
  const d2 = S.draft, sc = d2.scoring;
  const base = {
    teacher: plan.teacher, duration: Math.round(+d2.duration) || 90,
    maxLogins: Math.max(0, Math.round(+d2.maxLogins || 0)), preventReload: !!d2.preventReload,
    openAt: d2.openAt ? new Date(d2.openAt).getTime() : null, closeAt: d2.closeAt ? new Date(d2.closeAt).getTime() : null,
    showAnswers: !!d2.showAnswers, showScore: !!d2.showScore,
    maxViol: Math.round(+d2.maxViol || 0), fullscreen: !!d2.fullscreen,
    scoring: { mc: +sc.mc, sa: +sc.sa, tf: [0, +sc.tf1, +sc.tf2, +sc.tf3, +sc.tf4] }
  };
  const made = [];
  try {
    const idx = { mc: 0, tf: 0, sa: 0 };
    for (let i = 0; i < plan.n; i++){
      toast(`Đang tạo đề ${i + 1}/${plan.n}…`);
      const questions = [], answers = {}, sol = {};
      let k = 1;
      for (const type of ['mc', 'tf', 'sa']){
        for (let j = 0; j < plan.t[type]; j++){
          const it = plan.pool[type][idx[type]++];
          questions.push({ n: k, type, q: it.qRefs, src: { code: it.code, n: it.n } });
          answers[k] = it.ans;
          if (it.sRefs.length) sol[k] = it.sRefs;
          k++;
        }
      }
      const code = await freeCode();
      const exam = { ...base, code, title: `${plan.title} ${i + 1}`, createdAt: Date.now() + i, questions };
      await S.be.set('keys', code, { code, answers, sol });
      await S.be.set('exams', code, exam);
      made.push(exam);
    }
    if (plan.del){
      toast('Đang xoá các đề nguồn…');
      await purgeExams(plan.codes);
    }
    S.qb.loaded = false; S.qb.sel = new Set();
    await loadExams();
    if (S.qb.open) await loadQBank();
    await modal({ title: `Đã tạo ${made.length} đề`, wide: true, ok: 'Đóng', cancel: '',
      html: `<div class="table-wrap"><table><thead><tr><th>Tên đề</th><th>Mã đề</th><th class="num">Số câu</th></tr></thead><tbody>${made.map(E => `<tr><td>${esc(E.title)}</td><td><strong class="code-inline">${esc(E.code)}</strong></td><td class="num">${E.questions.length}</td></tr>`).join('')}</tbody></table></div><p class="hint" style="margin-top:10px">Gửi mã cho học sinh khi cần. Xem lại danh sách ở thẻ Quản lý đề.${plan.del ? ' Các đề nguồn đã được xoá.' : ''}</p>` });
  } catch(e){
    toast('Dừng giữa chừng: ' + (e.message || e) + `. Đã tạo ${made.length} đề.`, 'err');
    await loadExams();
  }
}
async function exportDraftKey(){
  const d = S.draft;
  if (!d.questions.length){ toast('Danh sách chưa có câu nào.', 'err'); return; }
  if (!window.XLSX){ toast('Không tải được thư viện Excel. Kiểm tra mạng rồi tải lại trang.', 'err'); return; }
  const rows = [['STT', 'Đáp án', 'Loại câu', 'Lấy từ đề', 'Câu gốc'],
    ...d.questions.map(q => [q.n, canon(q) || String(q.answer || ''), TYPE_LABEL[q.type], q.src ? q.src.code : '', q.src ? q.src.n : ''])];
  const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = [{ wch: 6 }, { wch: 12 }, { wch: 16 }, { wch: 12 }, { wch: 10 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Đáp án');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const slug = (d.title || 'de-moi').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'de_moi';
  try { await S.be.save(`Dap_an_${slug}.xlsx`, new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); }
  catch(e){ if (!(e && e.code === 'declined')) toast('Không tải được file: ' + ((e && (e.message || e.code)) || e), 'err'); }
}

/* ---------------- sự kiện ---------------- */
document.addEventListener('click', e => {
  const im = e.target.closest('.qimg[src]');
  if (im){ const v = document.createElement('div'); v.className = 'imgview'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', 'Ảnh phóng to, chạm để đóng'); v.tabIndex = -1; const c = new Image(); c.src = im.src; c.alt = im.alt; v.appendChild(c); const close = () => { v.remove(); document.removeEventListener('keydown', k, true); }; const k = ev => { if (ev.key === 'Escape'){ ev.preventDefault(); close(); } }; v.addEventListener('click', close); document.addEventListener('keydown', k, true); document.body.appendChild(v); v.focus(); }
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const A = el.dataset.act;
  const x = S.x;
  switch (A){
    case 'home': if (S.view === 'exam') return; S.role = null; if (S.h.preview) S.h = { name: '' }; go('home'); break;
    case 'role-teacher': openTeacher(); break;
    case 'role-student': S.role = 'student'; if (S.h.preview) S.h = { name: '' }; go('student'); break;
    case 'ttab': stopLive(); S.ttab = el.dataset.k; render(); if (S.ttab !== 'create') loadExams(); if (S.ttab === 'psets') loadPsets(); if (S.ttab === 'bank') loadBank(); break;
    case 'import': doImport(); break;
    case 'q-add': addQ(); break;
    case 'qb-open': toggleQBank(); break;
    case 'qb-reload': loadQBank(); break;
    case 'qb-random': qbRandom(); break;
    case 'qb-auto': qbAuto(); break;
    case 'qb-shuffle': shuffleExams(); break;
    case 'q-xls': exportDraftKey(); break;
    case 'qb-clear': S.qb.sel = new Set(); qbSync(); break;
    case 'qb-add': qbAdd(); break;
    case 'qb-view': qbView(el.dataset.id); break;
    case 'q-del': delQ(+el.dataset.i); break;
    case 'publish': publish(); break;
    case 'live-start': startLive(); break;
    case 'zoom': { const z = +el.dataset.z; S.live.zoom = z === 0 ? 1 : Math.min(1.6, Math.max(0.6, Math.round((S.live.zoom + z * 0.1) * 10) / 10)); const zv = $('#zv'); if (zv) zv.textContent = Math.round(S.live.zoom * 100) + '%'; paintLive(); break; }
    case 'res-load': loadResults(el.dataset.code); break;
    case 'export': exportExcel(); break;
    case 'del-exam': deleteExam(el.dataset.code); break;
    case 'rate': { const i = +el.dataset.i; S.res.sel = S.res.sel === i ? null : i; $$('.qcol').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === S.res.sel))); $('#rate-detail').innerHTML = rateDetail(S.res.sel == null ? i : S.res.sel); break; }
    case 'check-code': checkCode(); break;
    case 'begin': begin(); break;
    case 'resume': resumeSess(); break;
    case 'force-submit': { const E = S.st.exam, s = loadSess(E.code); if (s && await modal({ title: 'Nộp phần đã làm?', body: `Nộp bài của ${s.name} với các câu đã lưu trên máy này.`, ok: 'Nộp bài' })) { S.x = null; finalize(E, s, 'saved'); } break; }
    case 'view-past': viewPast(); break;
    case 'mc': if (x){ const q = x.exam.questions[x.sess.idx]; const v = el.dataset.v; if (x.sess.answers[q.n] === v) delete x.sess.answers[q.n]; else x.sess.answers[q.n] = v; $$('[data-act="mc"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === x.sess.answers[q.n]))); changed(); } break;
    case 'tf': if (x){ const q = x.exam.questions[x.sess.idx]; const arr = Array.isArray(x.sess.answers[q.n]) ? [...x.sess.answers[q.n]] : [null, null, null, null]; const i = +el.dataset.i; arr[i] = arr[i] === el.dataset.v ? null : el.dataset.v; if (arr.every(v => !v)) delete x.sess.answers[q.n]; else x.sess.answers[q.n] = arr; $$(`[data-act="tf"][data-i="${i}"]`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === arr[i]))); changed(); } break;
    case 'prev': if (x) moveTo(x.sess.idx - 1); break;
    case 'next': if (x) moveTo(x.sess.idx + 1); break;
    case 'goto': if (x) moveTo(+el.dataset.i); break;
    case 'submit': submitExam(); break;
    case 'resend': S.done.state = 'sending'; render(); sendResult(); break;
    case 'cmt': editComment(el.dataset.id); break;
    case 'sub-view': viewSub(el.dataset.id); break;
    case 'exam-edit': editExam(el.dataset.code); break;
    case 'exam-sync': syncExamFiles(el.dataset.code); break;
    case 'exam-key': exportKey(el.dataset.code); break;
    case 'add-time': addTime(el.dataset.id); break;
    case 'reset-login': resetLogin(el.dataset.id); break;
    case 'pv-start': startPreview(); break;
    case 'pv-exit': if (S.x && S.x.sess.preview && await modal({ title: 'Thoát xem thử?', body: 'Bài làm thử sẽ bị bỏ, không lưu lại.', ok: 'Thoát xem thử' })){ clearInterval(S.xTick); S.x = null; go('teacher'); } break;
    case 'export-all': exportAll(el); break;
    case 'h-load': loadMine(); break;
    case 'h-view': viewMine(el.dataset.code); break;
    case 'p-start': startPractice(); break;
    case 'p-mc': if (S.p){ const w = S.p.list[S.p.idx]; if (S.p.res[w.id]) break; if (S.p.ans[w.id] === el.dataset.v) delete S.p.ans[w.id]; else S.p.ans[w.id] = el.dataset.v; fillPZone(); } break;
    case 'p-tf': if (S.p){ const w = S.p.list[S.p.idx]; if (S.p.res[w.id]) break; const arr = Array.isArray(S.p.ans[w.id]) ? [...S.p.ans[w.id]] : [null, null, null, null]; const i = +el.dataset.i; arr[i] = arr[i] === el.dataset.v ? null : el.dataset.v; if (arr.every(v => !v)) delete S.p.ans[w.id]; else S.p.ans[w.id] = arr; fillPZone(); } break;
    case 'p-check': pCheck(); break;
    case 'p-retry': if (S.p){ const w = S.p.list[S.p.idx]; delete S.p.res[w.id]; delete S.p.ans[w.id]; fillPZone(); fillPRes(); } break;
    case 'p-prev': pMove(S.p.idx - 1); break;
    case 'p-next': pMove(S.p.idx + 1); break;
    case 'p-finish': S.p.finished = true; render(); window.scrollTo(0, 0); break;
    case 'p-again': startPractice(S.p.list.filter(w => !(S.p.res[w.id] && S.p.res[w.id].ok)), S.p.set); break;
    case 'ps-start': startSet(el.dataset.id); break;
    case 'ps-enter': enterSetByCode(el.dataset.id); break;
    case 'bank-reload': loadBank(); break;
    case 'fs-enter': enterFS(); break;
    case 'vlog': showVlog(el.dataset.id); break;
    case 'bank-view': bankView(el.dataset.id); break;
    case 'bank-replace': replaceQuestion(el.dataset.id); break;
    case 'ps-reset-time': resetSetTime(el.dataset.set, el.dataset.id); break;
    case 'bank-assign': bankAssign(); break;
    case 'bank-clear': S.bank.sel = new Set(); $$('[data-bank]').forEach(b => { b.checked = false; b.closest('.bank-row').classList.remove('sel'); }); bankSyncBar(); break;
    case 'ps-create': createPset(); break;
    case 'ps-prog': psetProgress(el.dataset.id); break;
    case 'ps-edit': editPset(el.dataset.id); break;
    case 'ps-del': delPset(el.dataset.id); break;
    case 'p-exit': clearInterval(S.pTick); S.p = null; go(S.h.preview ? 'teacher' : 'student'); break;
    case 'exit': if (S.done && (S.done.preview || S.done.teacher || S.done.asStudent)){ S.done = null; go('teacher'); break; }
      S.done = null; if (S.st.exam){ try { S.st.exam = await S.be.get('exams', S.st.exam.code) || S.st.exam; } catch(err){} } go('student'); break;
  }
});
function onField(e){
  const t = e.target, d = S.draft;
  if (t.dataset.d !== undefined){ const k = t.dataset.d; d[k] = t.type === 'checkbox' ? t.checked : t.value; if (k === 'teacher') t.setAttribute('aria-invalid', String(!t.value.trim())); }
  else if (t.dataset.sc !== undefined) d.scoring[t.dataset.sc] = t.value;
  else if (t.dataset.q !== undefined){
    const i = +t.dataset.i, q = d.questions[i]; if (!q) return;
    if (t.dataset.q === 'type'){ q.type = t.value; q.manual = true; }
    else { q.answer = t.value; if (!q.manual){ const ty = detectType(t.value); if (ty && ty !== q.type){ q.type = ty; const sel = $(`select[data-q="type"][data-i="${i}"]`); if (sel) sel.value = ty; } } }
    const inp = $(`input[data-q="answer"][data-i="${i}"]`); if (inp) inp.placeholder = PLACEHOLDER[q.type];
    const er = $('#qerr-' + i); if (er) er.textContent = answerError(q);
  }
}
document.addEventListener('input', e => { if (e.target.id === 'bk-title' && S.bank) S.bank.title = e.target.value; });
document.addEventListener('input', onField);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.flag){ setFlag(t.dataset.flag, t.checked, t); return; }
  if (t.dataset.qb){ if (t.checked) S.qb.sel.add(t.dataset.qb); else S.qb.sel.delete(t.dataset.qb); qbSync(); return; }
  if (t.dataset.qbTarget){ S.qb.targets[t.dataset.qbTarget] = t.value; qbSync(); return; }
  if (t.id === 'qb-code'){ S.qb.code = t.value; paintQB(); return; }
  if (t.id === 'qb-renum'){ S.qb.renumber = t.checked; return; }
  if (t.dataset.bank){ bankToggle(t.dataset.bank, t.checked); bankSyncBar(); return; }
  if (t.dataset.bankAll){ bankVisible().filter(it => it.q.type === t.dataset.bankAll).forEach(it => bankToggle(it.id, t.checked)); bankSyncBar(); return; }
  if (t.id === 'bk-st' || t.id === 'bk-code'){ S.bank[t.id === 'bk-st' ? 'st' : 'code'] = t.value; S.bank.sel = new Set(); paintBank(); return; }
  if (t.id === 'bk-open' || t.id === 'bk-close'){ S.bank[t.id === 'bk-open' ? 'open' : 'close'] = t.value; return; }
  if (t.id === 'bk-dur'){ S.bank.dur = t.value; return; }
  if (t.name === 'ps-code'){ const c = $('#ps-count'); if (c) c.textContent = $$('input[name="ps-code"]:checked').length; return; }
  if (t.id === 'p-only'){ S.h.onlyNew = t.checked; S.h.pick = 'all'; paintMine(); return; }
  if (t.id === 'p-pick'){ S.h.pick = t.value; return; }
  if (t.id === 'f-excel'){ S.draft.excelFile = t.files[0] || null; $('#f-excel-name').textContent = S.draft.excelFile ? S.draft.excelFile.name : 'Chưa chọn file'; return; }
  if (t.id === 'f-imgs'){ S.draft.imageFiles = [...t.files]; $('#f-imgs-name').textContent = t.files.length ? `${t.files.length} file đã chọn` : 'Chưa chọn file'; return; }
  if (t.dataset.slot){
    const q = S.draft.questions[+t.dataset.i]; if (!q || !t.files.length) return;
    const key = t.dataset.slot === 'q' ? 'qImgs' : 'sImgs';
    q[key].forEach(x => URL.revokeObjectURL(x.url));
    q[key] = [...t.files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true })).map(f => ({ blob: f, url: URL.createObjectURL(f) }));
    refreshQList(); return;
  }
  onField(e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.defaultPrevented) return;
  const id = e.target.id;
  if (id === 'code'){ e.preventDefault(); checkCode(); }
  else if (id === 'st-name' || id === 'st-cls'){ e.preventDefault(); begin(); }
  else if (id === 'h-name'){ e.preventDefault(); loadMine(); }
  else if (id === 'ps-name'){ e.preventDefault(); const b = $('[data-act="ps-enter"]'); if (b) enterSetByCode(b.dataset.id); }
});
document.addEventListener('mouseover', e => { const c = e.target.closest('.qcol'); if (c && $('#rate-detail')) $('#rate-detail').innerHTML = rateDetail(+c.dataset.i); });
document.addEventListener('focusin', e => { const c = e.target.closest && e.target.closest('.qcol'); if (c && $('#rate-detail')) $('#rate-detail').innerHTML = rateDetail(+c.dataset.i); });
document.addEventListener('mouseout', e => { const ch = e.target.closest && e.target.closest('#rate-chart'); if (ch && !ch.contains(e.relatedTarget) && $('#rate-detail')) $('#rate-detail').innerHTML = rateDetail(S.res.sel); });
document.addEventListener('visibilitychange', () => document.hidden ? onAway() : onBack());
window.addEventListener('blur', onAway);
document.addEventListener('fullscreenchange', onFS);
document.addEventListener('webkitfullscreenchange', onFS);
try { if (window.screen && typeof window.screen.addEventListener === 'function') window.screen.addEventListener('change', checkScreens); } catch(e){}
const inExam = () => S.view === 'exam' && S.x && !S.x.submitting;
let copyAt = 0;
function blockCopy(e){
  if (!inExam()) return;
  const t = e.target;
  if (e.type !== 'contextmenu' && t && t.tagName === 'INPUT') return;
  e.preventDefault();
  if (Date.now() - copyAt > 10000){ copyAt = Date.now(); logV('copy'); }
}
['copy', 'cut', 'contextmenu', 'dragstart'].forEach(ev => document.addEventListener(ev, blockCopy));
document.addEventListener('selectstart', e => { if (inExam() && !(e.target && e.target.tagName === 'INPUT')) e.preventDefault(); });
function onShotKey(e){
  if (!inExam()) return;
  const k = (e.key || '').toLowerCase();
  const shot = k === 'printscreen' || e.code === 'PrintScreen' || (e.type === 'keydown' && e.shiftKey && (e.metaKey) && ['3', '4', '5', 's'].includes(k));
  const print = e.type === 'keydown' && (e.ctrlKey || e.metaKey) && k === 'p';
  if (print){ e.preventDefault(); if (logV('print')) warnVio('Không được in bài thi.'); return; }
  if (shot){ if (logV('shot')) warnVio('Phát hiện thao tác chụp màn hình.'); }
}
document.addEventListener('keydown', onShotKey, true);
document.addEventListener('keyup', e => { if ((e.key || '').toLowerCase() === 'printscreen' || e.code === 'PrintScreen') onShotKey(e); }, true);
window.addEventListener('beforeprint', () => { if (inExam() && logV('print')) setTimeout(() => warnVio('Không được in bài thi.'), 300); });
window.addEventListener('focus', onBack);
window.addEventListener('beforeunload', e => { if (S.view === 'exam' && S.x && !S.x.submitting && !S.x.sess.preview){ e.preventDefault(); e.returnValue = ''; } });

/* ---------------- khởi động ---------------- */
(async () => {
  render();
  try { S.be = await initBackend(); }
  catch(e){ S.fatal = (e && e.message) || String(e); S.view = 'fatal'; render(); return; }
  const active = LS.get('tt_active');
  if (active){
    let E = null; try { E = await S.be.get('exams', active); } catch(e){}
    const sess = loadSess(active);
    if (E && sess){
      S.role = 'student'; S.st = { code: active, exam: E };
      if (sess.status === 'submitting'){ S.done = { exam: E, sess, reason: sess.reason || 'manual', state: 'sending' }; go('result'); sendResult(); return; }
      if (!E.preventReload && Date.now() < sess.endAt + extraFor(E, sess.subId) * 60000){ enterExam(E, sess); return; }
      go('student'); return;
    }
    LS.del('tt_active');
  }
  go('home');
})();
